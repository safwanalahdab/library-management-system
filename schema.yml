openapi: 3.0.3
info:
  title: Library Management System API
  version: 1.0.0
  description: توثيق API لنظام إدارة المكتبة
paths:
  /accounts/change_password:
    post:
      operationId: profile_change_password
      description: يتحقق من كلمة المرور الحالية، وتطابق كلمتي المرور الجديدتين، ومدققات
        قوة كلمة المرور. أخطاء هذه الحالات تبقى VALIDATION_ERROR بأسماء الحقول.
      summary: تغيير كلمة المرور
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordSerilaizer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordSerilaizer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordSerilaizer'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangedSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR مع تفاصيل الحقول.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/governorates:
    get:
      operationId: governorates_active_list
      description: قائمة عامة بالمحافظات الفعالة (المعرّف والاسم فقط) لاستخدامها في
        التسجيل.
      summary: قائمة المحافظات الفعالة
      tags:
      - Authentication
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GovernorateListSuccessEnvelope'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/libraries/:
    get:
      operationId: libraries_list
      description: 'MINISTRY_ADMIN: جميع المكتبات المفعّلة وغير المفعّلة. GOVERNORATE_ADMIN:
        مكتبات محافظته. LIBRARIAN: مكتبته فقط ولو كانت غير مفعّلة. READER: المكتبات
        المفعّلة ضمن محافظته فقط. الفلاتر تضيّق النطاق المسموح ولا توسّعه. الترتيب
        حسب الاسم ثم المعرّف.'
      summary: قائمة المكتبات ضمن نطاق مقدم الطلب
      parameters:
      - in: query
        name: governorate
        schema:
          type: integer
        description: معرّف المحافظة.
      - in: query
        name: is_active
        schema:
          type: boolean
        description: true أو false.
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
        description: بحد أقصى 100.
      - in: query
        name: search
        schema:
          type: string
        description: بحث جزئي في اسم المكتبة.
      tags:
      - Library Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLibraryListSuccessEnvelopeList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR عند قيمة فلتر غير صالحة.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED لحساب بلا دور صالح.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
    post:
      operationId: libraries_create
      description: متاح لـMINISTRY_ADMIN وGOVERNORATE_ADMIN. الوزارة تحدد governorate
        (محافظة فعالة). مسؤول المحافظة تُعيَّن محافظته تلقائياً، وإرسال محافظة مختلفة
        يُرفض. المكتبة الجديدة مفعّلة دائماً؛ إرسال is_active أو أي حقل غير مسموح
        يُرفض بـVALIDATION_ERROR.
      summary: إنشاء مكتبة
      tags:
      - Library Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Library'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Library'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Library'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryCreateSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR مع تفاصيل الحقول.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED لأمين المكتبة والقارئ.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/libraries/{id}/:
    get:
      operationId: libraries_retrieve
      description: المكتبة خارج نطاق مقدم الطلب تعاد كـNOT_FOUND دون كشف وجودها.
      summary: جلب مكتبة ضمن النطاق
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this library.
        required: true
      tags:
      - Library Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryRetrieveSuccessEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED لحساب بلا دور صالح.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND، ويشمل المكتبة خارج النطاق.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
    patch:
      operationId: libraries_update
      description: 'الحقول المسموحة: name وaddress وphone وemail. متاح لـMINISTRY_ADMIN
        وGOVERNORATE_ADMIN ضمن نطاقه ولـLIBRARIAN على مكتبته فقط. لا يمكن تغيير governorate
        بعد الإنشاء (إرسال القيمة الحالية مقبول دون أثر). إرسال is_active أو أي حقل
        غير مسموح يُرفض بـVALIDATION_ERROR.'
      summary: تعديل بيانات مكتبة
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this library.
        required: true
      tags:
      - Library Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLibrary'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLibrary'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLibrary'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryUpdateSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR مع تفاصيل الحقول.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED للقارئ.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND، ويشمل المكتبة خارج النطاق.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/libraries/{id}/activate/:
    post:
      operationId: library_activate
      description: متاح لـMINISTRY_ADMIN وGOVERNORATE_ADMIN ضمن نطاقه. التكرار لا
        يسبب خطأ.
      summary: تفعيل مكتبة
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this library.
        required: true
      tags:
      - Library Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryActivateSuccessEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED لأمين المكتبة والقارئ.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND، ويشمل المكتبة خارج النطاق.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/libraries/{id}/deactivate/:
    post:
      operationId: library_deactivate
      description: متاح لـMINISTRY_ADMIN وGOVERNORATE_ADMIN ضمن نطاقه. لا يحذف المكتبة
        ولا علاقاتها، ولا يغيّر حالة حسابات المستخدمين المرتبطين بها. التكرار لا يسبب
        خطأ.
      summary: إلغاء تفعيل مكتبة
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this library.
        required: true
      tags:
      - Library Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryDeactivateSuccessEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED لأمين المكتبة والقارئ.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND، ويشمل المكتبة خارج النطاق.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/login:
    post:
      operationId: auth_login
      description: يعيد access token في JSON، بينما يُرسل refresh token كـHttpOnly
        Cookie باسم `refresh_token` ولا يظهر في جسم الاستجابة.
      summary: تسجيل الدخول
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: INVALID_CREDENTIALS أو VALIDATION_ERROR.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/logout:
    post:
      operationId: auth_logout
      description: يتطلب Bearer access token ويقرأ `refresh_token` من HttpOnly Cookie.
        يبطل refresh token عبر blacklist؛ ولا يبطل access token الحالي فورًا. غياب
        refresh cookie يبقى نجاحًا idempotent حسب السلوك الحالي.
      summary: تسجيل الخروج
      parameters:
      - in: cookie
        name: refresh_token
        schema:
          type: string
        description: HttpOnly refresh cookie المنشأة عند تسجيل الدخول.
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccessEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو AUTHENTICATION_FAILED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/me:
    get:
      operationId: auth_me
      description: Apply the shared success envelope to selected DRF views only.
      summary: بيانات المستخدم الحالي
      tags:
      - Profile
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserSuccessEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/profile:
    get:
      operationId: profile_get
      description: Apply the shared success envelope to selected DRF views only.
      summary: جلب الملف الشخصي
      tags:
      - Profile
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSuccessEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
    put:
      operationId: profile_replace
      description: الحقول القابلة للتعديل موضحة في request schema. إرسال role أو is_active
        أو is_staff أو is_superuser أو groups أو user_permissions أو password يُرفض
        بـVALIDATION_ERROR، وكذلك governorate أو library بقيمة تختلف عن القيمة الحالية.
        borrowing_blocked للقراءة فقط.
      summary: تحديث الملف الشخصي بالكامل
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateSchema'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileUpdateSchema'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileUpdateSchema'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
    patch:
      operationId: profile_update
      description: 'يسمح فقط بـemail وfirst_name وlast_name وحقول profile: address
        وphone وgender وage. إرسال حقول الدور أو الصلاحيات أو كلمة المرور، أو تغيير
        governorate أو library، يُرفض بـVALIDATION_ERROR.'
      summary: تحديث جزئي للملف الشخصي
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateSchema'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateSchema'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateSchema'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePatchSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/refresh:
    post:
      operationId: auth_refresh
      description: لا يستقبل body. يقرأ refresh token حصريًا من HttpOnly Cookie باسم
        `refresh_token`. قد لا تتمكن Swagger UI من إنشاء هذه الكوكي يدويًا؛ عادةً
        تُحفظ تلقائيًا من استجابة login عند استخدام نفس الأصل.
      summary: تجديد access token
      parameters:
      - in: cookie
        name: refresh_token
        schema:
          type: string
        description: HttpOnly refresh cookie المنشأة عند تسجيل الدخول.
        required: true
      tags:
      - Authentication
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshSuccessEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN أو AUTHENTICATION_FAILED.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/register:
    post:
      operationId: auth_register
      description: ينشئ حساب READER دائماً ضمن محافظة فعالة يختارها المستخدم، دون
        مكتبة. لا يقبل role أو library أو أي حقول إدارية مثل is_staff وis_superuser
        وgroups وuser_permissions. لا يسجّل الدخول تلقائياً.
      summary: تسجيل حساب قارئ جديد
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR مع تفاصيل الحقول.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /dashboard/users/:
    get:
      operationId: users_list
      description: متاح لـGOVERNORATE_ADMIN فأعلى. SUPERUSER لجميع المستخدمين، MINISTRY_ADMIN
        لمستخدمي النظام، GOVERNORATE_ADMIN ضمن محافظته (القراء حسب محافظتهم المباشرة
        والأمناء حسب محافظة مكتبتهم). LIBRARIAN وREADER ممنوعان؛ يستخدم LIBRARIAN
        مسار reader-search.
      summary: قائمة المستخدمين ضمن نطاق مقدم الطلب
      parameters:
      - in: query
        name: name
        schema:
          type: string
        description: بحث جزئي في username أو الاسم الأول أو الأخير.
      tags:
      - User Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserListSuccessEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
    post:
      operationId: users_create
      description: 'الأدوار المسموحة: SUPERUSER ينشئ جميع Business roles؛ MINISTRY_ADMIN
        ينشئ GOVERNORATE_ADMIN/LIBRARIAN/READER؛ GOVERNORATE_ADMIN ينشئ LIBRARIAN/READER
        ضمن محافظته؛ LIBRARIAN ينشئ READER فقط؛ READER ممنوع. GOVERNORATE_ADMIN يحتاج
        governorate، وLIBRARIAN يحتاج library دون governorate. READER يرتبط بمحافظة
        دون مكتبة: الوزارة تحدد governorate، بينما تُعين محافظة GOVERNORATE_ADMIN
        أو محافظة مكتبة LIBRARIAN server-side، وإرسال محافظة مختلفة يُرفض. is_staff
        وis_superuser وgroups وuser_permissions ليست مدخلات مسموحة.'
      summary: إنشاء مستخدم
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAdminCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserAdminCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserAdminCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
