openapi: 3.0.3
info:
  title: Library Management System API
  version: 1.0.0
  description: توثيق API لنظام إدارة المكتبة
paths:
  /accounts/change_password:
    post:
      operationId: profile_change_password
      description: يتحقق من كلمة المرور الحالية، وتطابق كلمتي المرور الجديدتين، ومدققات
        قوة كلمة المرور. أخطاء هذه الحالات تبقى VALIDATION_ERROR بأسماء الحقول.
      summary: تغيير كلمة المرور
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordSerilaizer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordSerilaizer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordSerilaizer'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangedSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR مع تفاصيل الحقول.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/login:
    post:
      operationId: auth_login
      description: يعيد access token في JSON، بينما يُرسل refresh token كـHttpOnly
        Cookie باسم `refresh_token` ولا يظهر في جسم الاستجابة.
      summary: تسجيل الدخول
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: INVALID_CREDENTIALS أو VALIDATION_ERROR.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/logout:
    post:
      operationId: auth_logout
      description: يتطلب Bearer access token ويقرأ `refresh_token` من HttpOnly Cookie.
        يبطل refresh token عبر blacklist؛ ولا يبطل access token الحالي فورًا. غياب
        refresh cookie يبقى نجاحًا idempotent حسب السلوك الحالي.
      summary: تسجيل الخروج
      parameters:
      - in: cookie
        name: refresh_token
        schema:
          type: string
        description: HttpOnly refresh cookie المنشأة عند تسجيل الدخول.
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccessEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو AUTHENTICATION_FAILED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/me:
    get:
      operationId: auth_me
      description: Apply the shared success envelope to selected DRF views only.
      summary: بيانات المستخدم الحالي
      tags:
      - Profile
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserSuccessEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/profile:
    get:
      operationId: profile_get
      description: Apply the shared success envelope to selected DRF views only.
      summary: جلب الملف الشخصي
      tags:
      - Profile
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSuccessEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
    put:
      operationId: profile_replace
      description: الحقول القابلة للتعديل موضحة في request schema. لا يمكن تعديل role
        أو governorate أو library أو is_active أو is_staff أو is_superuser أو password
        أو borrowing_blocked.
      summary: تحديث الملف الشخصي بالكامل
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateSchema'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileUpdateSchema'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileUpdateSchema'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
    patch:
      operationId: profile_update
      description: 'يسمح فقط بـemail وfirst_name وlast_name وحقول profile: address
        وphone وgender وage. حقول الدور والنطاق والحالة وكلمة المرور وحظر الاستعارة
        غير قابلة للتعديل هنا.'
      summary: تحديث جزئي للملف الشخصي
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateSchema'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateSchema'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateSchema'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePatchSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /accounts/refresh:
    post:
      operationId: auth_refresh
      description: لا يستقبل body. يقرأ refresh token حصريًا من HttpOnly Cookie باسم
        `refresh_token`. قد لا تتمكن Swagger UI من إنشاء هذه الكوكي يدويًا؛ عادةً
        تُحفظ تلقائيًا من استجابة login عند استخدام نفس الأصل.
      summary: تجديد access token
      parameters:
      - in: cookie
        name: refresh_token
        schema:
          type: string
        description: HttpOnly refresh cookie المنشأة عند تسجيل الدخول.
        required: true
      tags:
      - Authentication
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshSuccessEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN أو AUTHENTICATION_FAILED.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /dashboard/users/:
    get:
      operationId: users_list
      description: 'النتائج scoped حسب السياسة الحالية: SUPERUSER لجميع المستخدمين
        الذين يعيدهم queryset الحالي، MINISTRY_ADMIN لمستخدمي النظام، GOVERNORATE_ADMIN
        ضمن محافظته، وLIBRARIAN لنفسه وReaders ضمن مكتبته. READER يخضع للصلاحيات الحالية.'
      summary: قائمة المستخدمين ضمن نطاق مقدم الطلب
      parameters:
      - in: query
        name: name
        schema:
          type: string
        description: بحث جزئي في username أو الاسم الأول أو الأخير.
      tags:
      - User Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserListSuccessEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
    post:
      operationId: users_create
      description: 'الأدوار المسموحة: SUPERUSER ينشئ جميع Business roles؛ MINISTRY_ADMIN
        ينشئ GOVERNORATE_ADMIN/LIBRARIAN/READER؛ GOVERNORATE_ADMIN ينشئ LIBRARIAN/READER
        ضمن محافظته؛ LIBRARIAN ينشئ READER ضمن مكتبته؛ READER ممنوع. GOVERNORATE_ADMIN
        يحتاج governorate، وLIBRARIAN يحتاج library، وREADER يحتاج library إلا عند
        إنشائه بواسطة LIBRARIAN حيث تُعين server-side. is_staff وis_superuser ليسا
        مدخلين مسموحين.'
      summary: إنشاء مستخدم
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAdminCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserAdminCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserAdminCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR مع أخطاء role أو governorate أو library أو
            password أو username.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /dashboard/users/{id}/:
    get:
      operationId: users_retrieve
      description: الهدف خارج scoped queryset يعاد كـNOT_FOUND دون كشف وجوده.
      summary: جلب مستخدم ضمن النطاق
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom user.
        required: true
      tags:
      - User Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRetrieveSuccessEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND، ويشمل الهدف خارج النطاق.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /dashboard/users/{id}/block[_-]borrowing/:
    post:
      operationId: user_block_borrowing
      description: المسار الفعلي يقبل `block_borrowing` و`block-borrowing` بسبب url_path
        الحالي.
      summary: حظر الاستعارة لمستخدم
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom user.
        required: true
      tags:
      - User Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBorrowingBlockedSuccessEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND للهدف خارج النطاق.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /dashboard/users/{id}/deactivate/:
    post:
      operationId: user_deactivate
      description: لا يحذف الحساب. يخضع للصلاحيات والنطاق الحاليين.
      summary: تعطيل حساب مستخدم
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom user.
        required: true
      tags:
      - User Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDeactivateSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR للحالات business-invalid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND للهدف خارج النطاق.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /dashboard/users/{id}/reactivate/:
    post:
      operationId: user_reactivate
      description: لا ينشئ حسابًا جديدًا، ويتحقق من بقاء النطاق التنظيمي فعالًا.
      summary: إعادة تفعيل حساب مستخدم
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom user.
        required: true
      tags:
      - User Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserReactivateSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR، بما فيه النطاق التنظيمي غير الفعال.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND للهدف خارج النطاق.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /dashboard/users/{id}/reset-password/:
    post:
      operationId: user_reset_password
      description: الصلاحية تعتمد على الدور والنطاق، ولا يسمح بإعادة تعيين كلمة مرور
        الذات حسب السياسة الحالية.
      summary: إعادة تعيين كلمة مرور مستخدم
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom user.
        required: true
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminPasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminPasswordReset'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPasswordResetSuccessEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR لتطابق أو قوة كلمة المرور.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND للهدف خارج النطاق.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
  /dashboard/users/{id}/unblock[_-]borrowing/:
    post:
      operationId: user_unblock_borrowing
      description: المسار الفعلي يقبل `unblock_borrowing` و`unblock-borrowing` بسبب
        url_path الحالي.
      summary: إلغاء حظر الاستعارة لمستخدم
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom user.
        required: true
      tags:
      - User Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBorrowingUnblockedSuccessEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AUTHENTICATION_REQUIRED أو INVALID_TOKEN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: PERMISSION_DENIED.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND للهدف خارج النطاق.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: THROTTLED.
components:
  schemas:
    AccessTokenDataSchema:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AdminPasswordReset:
      type: object
      properties:
        new_password:
          type: string
          writeOnly: true
        new_password_confirm:
          type: string
          writeOnly: true
      required:
      - new_password
      - new_password_confirm
    BlankEnum:
      enum:
      - ''
    BorrowingBlockedDataSchema:
      type: object
      properties:
        user_id:
          type: integer
        borrowing_blocked:
          type: boolean
        available_books:
          type: integer
      required:
      - available_books
      - borrowing_blocked
      - user_id
    BorrowingUnblockedDataSchema:
      type: object
      properties:
        user_id:
          type: integer
        borrowing_blocked:
          type: boolean
        tier:
          type: string
        max_allowed:
          type: integer
        active_borrows:
          type: integer
        available_books:
          type: integer
      required:
      - active_borrows
      - available_books
      - borrowing_blocked
      - max_allowed
      - tier
      - user_id
    Code205Enum:
      enum:
      - PROFILE_UPDATED
      type: string
      description: '* `PROFILE_UPDATED` - PROFILE_UPDATED'
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RequesterRoleSchema'
          readOnly: true
        governorate:
          type: integer
          readOnly: true
          nullable: true
        library:
          type: integer
          readOnly: true
          nullable: true
      required:
      - email
      - first_name
      - governorate
      - id
      - last_name
      - library
